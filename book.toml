[book]
title = "HoTT Rosetta"
description = "A pairing of the natural language text of the textbook Introduction to Homotopy Type Theory with agda code from the agda-unimath library"
language = "en"
multilingual = false
src = "book/src"

[build]
build-dir = "book"
create-missing = false

[preprocessor.index]

[preprocessor.links]

[preprocessor.pagetoc]

[preprocessor.katex]
renderers = ["html"]
include-src = false
block-delimiter = { left = "$$", right = "$$" }
inline-delimiter = { left = "$", right = "$" }
macros = "config/latex-macros.txt"

[preprocessor.catppuccin]
assets_version = "1.2.0"

[output.linkcheck]
follow-web-links = false

[output.html]
theme = "website/theme"
default-theme = "light"
preferred-dark-theme = "Ayu"
smart-punctuation = true
copy-fonts = true
additional-css = [
  "website/css/Agda.css",
  "website/css/Agda-highlight.css",
  "website/theme/catppuccin.css",
  "website/theme/catppuccin-admonish.css",
  "website/theme/pagetoc.css",
]
additional-js = ["website/js/custom.js", "website/theme/pagetoc.js"]
no-section-label = true

[output.html.print]
enable = false

[output.html.fold]
enable = true
level = 0

[output.html.search]
enable = true
limit-results = 15
teaser-word-count = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 2
copy-js = true
